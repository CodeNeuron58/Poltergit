# Optional free local alternative to Tiger Cloud. Requires Docker.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: poltergit
      POSTGRES_USER: poltergit
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poltergit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poltergit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  poltergit-data:
