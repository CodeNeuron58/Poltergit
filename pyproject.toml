[project]
name = "poltergit"
version = "0.1.0"
description = "A séance for your Git history. Every ghost brings receipts."
readme = "README.md"
authors = [
    { name = "Biprayan Choudhuri", email = "biprayanchoudhuri58@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sentry-sdk>=2.73.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
poltergit = "poltergit.cli:app"

[project.optional-dependencies]
voice = [
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
